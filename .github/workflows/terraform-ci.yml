name: terraform-ci

# Runs on every pull request so the required checks always report.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.16.6"

jobs:
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      security-events: write # upload Checkov SARIF to code scanning
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate and test
        run: |
          for stack in infra/bootstrap infra/foundation; do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
            terraform -chdir="$stack" test
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          for stack in infra/bootstrap infra/foundation; do
            tflint --chdir="$stack" --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
          done

      - name: Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload Checkov results
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: checkov.sarif
          category: checkov

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0

      - name: Trivy config scan
        run: trivy config --exit-code 1 --severity LOW,MEDIUM,HIGH,CRITICAL infra

  plan-foundation:
    name: plan-foundation
    needs: static-analysis
    # Forks and Dependabot get no OIDC token or secrets; a skipped job passes the
    # required check, and the apply workflow plans again before applying.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read # check out the code
      id-token: write # exchange the GitHub OIDC token for the plan role
      pull-requests: write # post the plan as a pull request comment
    env:
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the read-only plan role
        id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
        run: >-
          terraform -chdir=infra/foundation init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="region=$AWS_REGION"
          -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ARN"

      # Read-only role: no state lock is taken on pull requests.
      - name: terraform plan
        run: |
          set -o pipefail
          terraform -chdir=infra/foundation plan -input=false -lock=false -no-color -out=tfplan | tee plan.log
          terraform -chdir=infra/foundation show -no-color tfplan > plan.txt

      - name: Post the plan on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan:foundation -->';
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (process.env.ACCOUNT_ID) {
              plan = plan.split(process.env.ACCOUNT_ID).join('<account-id>');
            }
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n... truncated. The full plan is in the job log.';
            }
            const body = [
              marker,
              '### Terraform plan: foundation',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
