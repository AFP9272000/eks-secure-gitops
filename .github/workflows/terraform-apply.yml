name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/foundation/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions: {}

# Never cancel an apply halfway through.
concurrency:
  group: terraform-apply-foundation
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TERRAFORM_VERSION: "1.16.6"

jobs:
  apply-foundation:
    name: apply-foundation
    runs-on: ubuntu-24.04
    # The foundation environment only accepts deployments from main, and the
    # apply role trusts only this environment's subject claim.
    environment: foundation
    permissions:
      contents: read # check out the code
      id-token: write # exchange the GitHub OIDC token for the apply role
    env:
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
        run: >-
          terraform -chdir=infra/foundation init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="region=$AWS_REGION"
          -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ARN"

      - name: terraform apply
        run: terraform -chdir=infra/foundation apply -input=false -auto-approve -no-color
